
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrativo | Dulce Cuchara</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <main class="admin-container">
        <div class="admin-card">
            <h1>Panel administrativo</h1>
            <p>Gestión del catálogo de Dulce Cuchara.</p>

            <form id="producto-form" class="admin-form">
                <input type="text" id="nombre-producto"
                    placeholder="Nombre del postre">

                <input type="number" id="precio-producto"
                    placeholder="Precio">

                <button type="submit" class="admin-button">
                    Guardar producto
                </button>
            </form>

            <div id="lista-admin-productos"></div>
        </div>
    </main>

    <script src="../js/productos.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
